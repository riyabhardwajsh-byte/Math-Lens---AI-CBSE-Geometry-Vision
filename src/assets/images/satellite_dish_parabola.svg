<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="cosmosGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="70%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="dishGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="beamGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Space Background -->
  <rect width="800" height="600" fill="url(#cosmosGrad)" />

  <!-- Stars -->
  <g fill="#e2e8f0" opacity="0.7">
    <circle cx="100" cy="80" r="1.5" />
    <circle cx="220" cy="120" r="1" />
    <circle cx="700" cy="70" r="2" />
    <circle cx="630" cy="140" r="1.2" />
    <circle cx="340" cy="60" r="1.8" />
    <circle cx="510" cy="90" r="1" />
    <circle cx="140" cy="200" r="1.5" />
    <circle cx="720" cy="220" r="1.5" />
  </g>

  <!-- Mount Pedestal -->
  <polygon points="350,560 450,560 430,440 370,440" fill="#334155" stroke="#1e293b" stroke-width="4" />
  <rect x="360" y="420" width="80" height="25" rx="5" fill="#475569" stroke="#64748b" stroke-width="2" />
  <circle cx="400" cy="432" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="3" />

  <!-- Signal Focus Beam cone to focus point (400, 210) -->
  <polygon points="400,210 160,260 640,260" fill="url(#beamGlow)" />

  <!-- Parabolic Dish Shell: vertex at (400, 420), opening upward to rim at (160, 260) and (640, 260) -->
  <!-- Parabola equation: y = 0.00277 * (x - 400)^2 + 260; vertex at (400, 420) -->
  <path d="M 160 260 Q 400 440, 640 260 L 640 270 Q 400 455, 160 270 Z" fill="url(#dishGrad)" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Outer Rim Lip -->
  <ellipse cx="400" cy="260" rx="240" ry="24" fill="none" stroke="#67e8f9" stroke-width="4" />
  <ellipse cx="400" cy="260" rx="232" ry="20" fill="#0f172a" opacity="0.4" />

  <!-- Inner Surface Grid Ribs / Wire Mesh (Parabolic slices) -->
  <path d="M 220 275 Q 400 410, 580 275" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" />
  <path d="M 280 285 Q 400 390, 520 285" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
  <path d="M 340 292 Q 400 375, 460 292" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85" />

  <!-- Radial Ribs to Vertex -->
  <line x1="400" y1="420" x2="160" y2="260" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="420" x2="640" y2="260" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="420" x2="280" y2="282" stroke="#64748b" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="420" x2="520" y2="282" stroke="#64748b" stroke-width="2" opacity="0.6" />

  <!-- Subreflector Tripod Struts to Focal Point (400, 185) -->
  <line x1="200" y1="262" x2="400" y2="185" stroke="#f8fafc" stroke-width="3.5" />
  <line x1="600" y1="262" x2="400" y2="185" stroke="#f8fafc" stroke-width="3.5" />
  <line x1="400" y1="400" x2="400" y2="185" stroke="#94a3b8" stroke-width="3" />

  <!-- Receiver Feed Horn at Parabolic Focal Point -->
  <circle cx="400" cy="185" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
  <circle cx="400" cy="185" r="8" fill="#facc15" />
  <text x="400" y="155" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">FOCAL POINT (0, f)</text>
</svg>
