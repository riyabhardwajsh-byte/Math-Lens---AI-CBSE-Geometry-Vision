<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="warehouseBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rampBed" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Industrial Warehouse Interior -->
  <rect width="800" height="600" fill="url(#warehouseBg)" />

  <!-- Concrete Factory Floor -->
  <rect y="480" width="800" height="120" fill="#0b0f19" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#475569" stroke-width="3" />

  <!-- Hydraulic / Structural Vertical Supports for Incline -->
  <!-- Left lowest support at x = 160 -->
  <line x1="160" y1="480" x2="160" y2="400" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <!-- Mid support at x = 360 -->
  <line x1="360" y1="480" x2="360" y2="310" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <!-- High support at x = 580 -->
  <line x1="580" y1="480" x2="580" y2="210" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />

  <!-- Main Inclined Conveyor Bed & Frame:
       Lower Point: (140, 410)
       Upper Point: (640, 190)
       dx = 500, dy = -220 -> Incline angle ~23.7 degrees
  -->
  <!-- Lower Beam -->
  <polygon points="140,430 640,210 640,190 140,410" fill="url(#rampBed)" stroke="#0284c7" stroke-width="3" />

  <!-- Yellow & Black Hazard Stripes on Rail -->
  <line x1="140" y1="400" x2="640" y2="180" stroke="#facc15" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Conveyor Rubber Belt with Ribbed Cleats -->
  <line x1="140" y1="405" x2="640" y2="185" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
  <!-- Roller drums at ends -->
  <circle cx="140" cy="405" r="14" fill="#64748b" stroke="#cbd5e1" stroke-width="3" />
  <circle cx="640" cy="185" r="14" fill="#64748b" stroke="#cbd5e1" stroke-width="3" />

  <!-- Parcel Box Traveling Up Ramp -->
  <g transform="translate(380, 275) rotate(-23.7)">
    <rect x="-24" y="-36" width="48" height="36" rx="2" fill="#d97706" stroke="#b45309" stroke-width="2" />
    <line x1="-24" y1="-18" x2="24" y2="-18" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Right-Angled Trigonometric Triangle Overlay:
       Horizontal Run Base: from (140, 410) to (640, 410)
       Vertical Rise: from (640, 410) to (640, 190)
       Hypotenuse: from (140, 410) to (640, 190)
  -->
  <line x1="140" y1="410" x2="640" y2="410" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="640" y1="410" x2="640" y2="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
  
  <!-- Right Angle Symbol at (640, 410) -->
  <path d="M 625 410 L 625 395 L 640 395" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Incline Angle Arc θ at (140, 410) -->
  <path d="M 200 410 A 60 60 0 0 0 195 385" fill="none" stroke="#f43f5e" stroke-width="3" />
  <text x="215" y="400" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="bold">θ = 23°</text>

  <!-- Trigonometric Readouts -->
  <text x="390" y="435" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">HORIZONTAL RUN (Adjacent)</text>
  <text x="655" y="300" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" transform="rotate(90 655 300)" text-anchor="middle">RISE (Opposite)</text>
  <text x="370" y="225" fill="#facc15" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SLOPE: m = tan(θ) = Rise / Run</text>
</svg>
