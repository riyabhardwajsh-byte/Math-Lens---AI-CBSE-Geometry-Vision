<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyDesert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="solarCellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Sky & Desert Horizon -->
  <rect width="800" height="600" fill="url(#skyDesert)" />
  <rect y="460" width="800" height="140" fill="#451a03" opacity="0.9" />
  <polygon points="0,480 800,450 800,600 0,600" fill="#78350f" />

  <!-- Mounting Support Structure Legs -->
  <line x1="160" y1="420" x2="140" y2="520" stroke="#334155" stroke-width="14" stroke-linecap="round" />
  <line x1="640" y1="420" x2="660" y2="520" stroke="#334155" stroke-width="14" stroke-linecap="round" />
  <line x1="400" y1="420" x2="400" y2="525" stroke="#475569" stroke-width="14" stroke-linecap="round" />
  <line x1="140" y1="520" x2="660" y2="520" stroke="#1e293b" stroke-width="8" />

  <!-- Solar Array Outer Aluminum Frame: Rotated -4 degrees, centered near (400, 300) -->
  <g transform="translate(400, 290) rotate(-4)">
    <!-- Main Frame Drop Shadow -->
    <rect x="-312" y="-172" width="624" height="344" rx="8" fill="#0f172a" opacity="0.6" />
    <!-- Aluminum Outer Bezel -->
    <rect x="-310" y="-170" width="620" height="340" rx="8" fill="url(#frameGrad)" stroke="#cbd5e1" stroke-width="4" />
    <!-- Dark Inset Glass Bed -->
    <rect x="-295" y="-155" width="590" height="310" rx="4" fill="#030712" />

    <!-- 6 Columns x 4 Rows of Monocrystalline Solar Cells -->
    <g fill="url(#solarCellGrad)" stroke="#38bdf8" stroke-width="1.5">
      <!-- Row 1 -->
      <rect x="-285" y="-145" width="88" height="65" rx="3" />
      <rect x="-187" y="-145" width="88" height="65" rx="3" />
      <rect x="-89" y="-145" width="88" height="65" rx="3" />
      <rect x="9" y="-145" width="88" height="65" rx="3" />
      <rect x="107" y="-145" width="88" height="65" rx="3" />
      <rect x="205" y="-145" width="88" height="65" rx="3" />

      <!-- Row 2 -->
      <rect x="-285" y="-70" width="88" height="65" rx="3" />
      <rect x="-187" y="-70" width="88" height="65" rx="3" />
      <rect x="-89" y="-70" width="88" height="65" rx="3" />
      <rect x="9" y="-70" width="88" height="65" rx="3" />
      <rect x="107" y="-70" width="88" height="65" rx="3" />
      <rect x="205" y="-70" width="88" height="65" rx="3" />

      <!-- Row 3 -->
      <rect x="-285" y="5" width="88" height="65" rx="3" />
      <rect x="-187" y="5" width="88" height="65" rx="3" />
      <rect x="-89" y="5" width="88" height="65" rx="3" />
      <rect x="9" y="5" width="88" height="65" rx="3" />
      <rect x="107" y="5" width="88" height="65" rx="3" />
      <rect x="205" y="5" width="88" height="65" rx="3" />

      <!-- Row 4 -->
      <rect x="-285" y="80" width="88" height="65" rx="3" />
      <rect x="-187" y="80" width="88" height="65" rx="3" />
      <rect x="-89" y="80" width="88" height="65" rx="3" />
      <rect x="9" y="80" width="88" height="65" rx="3" />
      <rect x="107" y="80" width="88" height="65" rx="3" />
      <rect x="205" y="80" width="88" height="65" rx="3" />
    </g>

    <!-- Silver Busbars Across Cells -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.65">
      <line x1="-285" y1="-115" x2="293" y2="-115" />
      <line x1="-285" y1="-40" x2="293" y2="-40" />
      <line x1="-285" y1="35" x2="293" y2="35" />
      <line x1="-285" y1="110" x2="293" y2="110" />
    </g>
  </g>
</svg>
