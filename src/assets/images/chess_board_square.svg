    <rect x="544" y="300" width="48" height="48" fill="url(#darkWood)" />

    <!-- Row 6 -->
    <rect x="208" y="348" width="48" height="48" fill="url(#darkWood)" />
    <rect x="256" y="348" width="48" height="48" fill="url(#lightWood)" />
    <rect x="304" y="348" width="48" height="48" fill="url(#darkWood)" />
    <rect x="352" y="348" width="48" height="48" fill="url(#lightWood)" />
    <rect x="400" y="348" width="48" height="48" fill="url(#darkWood)" />
    <rect x="448" y="348" width="48" height="48" fill="url(#lightWood)" />
    <rect x="496" y="348" width="48" height="48" fill="url(#darkWood)" />
    <rect x="544" y="348" width="48" height="48" fill="url(#lightWood)" />

    <!-- Row 7 -->
    <rect x="208" y="396" width="48" height="48" fill="url(#lightWood)" />
    <rect x="256" y="396" width="48" height="48" fill="url(#darkWood)" />
    <rect x="304" y="396" width="48" height="48" fill="url(#lightWood)" />
    <rect x="352" y="396" width="48" height="48" fill="url(#darkWood)" />
    <rect x="400" y="396" width="48" height="48" fill="url(#lightWood)" />
    <rect x="448" y="396" width="48" height="48" fill="url(#darkWood)" />
    <rect x="496" y="396" width="48" height="48" fill="url(#lightWood)" />
    <rect x="544" y="396" width="48" height="48" fill="url(#darkWood)" />

    <!-- Row 8 -->
    <rect x="208" y="444" width="48" height="48" fill="url(#darkWood)" />
    <rect x="256" y="444" width="48" height="48" fill="url(#lightWood)" />
    <rect x="304" y="444" width="48" height="48" fill="url(#darkWood)" />
    <rect x="352" y="444" width="48" height="48" fill="url(#lightWood)" />
    <rect x="400" y="444" width="48" height="48" fill="url(#darkWood)" />
    <rect x="448" y="444" width="48" height="48" fill="url(#lightWood)" />
    <rect x="496" y="444" width="48" height="48" fill="url(#darkWood)" />
    <rect x="544" y="444" width="48" height="48" fill="url(#lightWood)" />
