  <!-- Border Notation Characters (A-H, 1-8) -->
  <g fill="#d97706" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="232" y="515">A</text><text x="280" y="515">B</text><text x="328" y="515">C</text><text x="376" y="515">D</text>
    <text x="424" y="515">E</text><text x="472" y="515">F</text><text x="520" y="515">G</text><text x="568" y="515">H</text>
    <text x="190" y="137">8</text><text x="190" y="185">7</text><text x="190" y="233">6</text><text x="190" y="281">5</text>
    <text x="190" y="329">4</text><text x="190" y="377">3</text><text x="190" y="425">2</text><text x="190" y="473">1</text>
  </g>

  <!-- Diagonal Pythagoras Line d = s * sqrt(2) -->
  <line x1="208" y1="492" x2="592" y2="108" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  
  <!-- Labels -->
  <text x="400" y="60" fill="#facc15" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">REGULAR SQUARE: Side s = 6.2 m | Diagonal d = s√2</text>
</svg>
