<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="blueprintBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#020b18" />
    </linearGradient>
    <linearGradient id="steelGirder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Industrial Engineering Workshop Background -->
  <rect width="800" height="600" fill="url(#blueprintBg)" />

  <!-- Subtle CAD Grid lines -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- Concrete Bearing Piers -->
  <rect x="140" y="440" width="80" height="120" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <rect x="580" y="440" width="80" height="120" fill="#1e293b" stroke="#334155" stroke-width="3" />

  <!-- Main Warren Triangular Truss Frame:
       Base left: (180, 440)
       Base right: (620, 440)
       Apex top: (400, 140)
  -->
  <!-- Bottom Tie Beam -->
  <line x1="180" y1="440" x2="620" y2="440" stroke="url(#steelGirder)" stroke-width="14" stroke-linecap="round" />
  <!-- Left Top Chords / Rafter -->
  <line x1="180" y1="440" x2="400" y2="140" stroke="url(#steelGirder)" stroke-width="14" stroke-linecap="round" />
  <!-- Right Top Chords / Rafter -->
  <line x1="620" y1="440" x2="400" y2="140" stroke="url(#steelGirder)" stroke-width="14" stroke-linecap="round" />

  <!-- Internal Web Struts & Diagonals (Warren Lattice) -->
  <g stroke="#38bdf8" stroke-width="6" opacity="0.9">
    <!-- Center Vertical King Post -->
    <line x1="400" y1="140" x2="400" y2="440" />
    <!-- Intermediate Subdivisions at x = 290 and 510 -->
    <line x1="290" y1="290" x2="290" y2="440" />
    <line x1="510" y1="290" x2="510" y2="440" />
    <!-- Diagonal Bracing -->
    <line x1="180" y1="440" x2="290" y2="290" />
    <line x1="290" y1="440" x2="400" y2="140" />
    <line x1="400" y1="140" x2="510" y2="440" />
    <line x1="510" y1="290" x2="620" y2="440" />
  </g>

  <!-- Gusset Plates / Riveted Joint Nodes -->
  <g fill="#0284c7" stroke="#e0f2fe" stroke-width="2.5">
    <circle cx="180" cy="440" r="16" />
    <circle cx="620" cy="440" r="16" />
    <circle cx="400" cy="140" r="18" />
    <circle cx="400" cy="440" r="15" />
    <circle cx="290" cy="290" r="13" />
    <circle cx="510" cy="290" r="13" />
    <circle cx="290" cy="440" r="13" />
    <circle cx="510" cy="440" r="13" />
  </g>

  <!-- Dimension Annotations -->
  <text x="400" y="475" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SPAN BASE: b = 11.2 m</text>
  <text x="400" y="115" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">APEX VERTEX (0, 4.2)</text>
</svg>
